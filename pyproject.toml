[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dash-ai"
version = "0.1.0"
description = "Local-first AI knowledge assistant using Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Edgar Treischl", email = "edgar@example.com"}
]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "great-docs>=0.17.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "great-docs>=0.17",
]

[project.scripts]
dash-ai = "dash_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -ra"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dash_ai"]
